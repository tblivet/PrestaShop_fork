<!-- <twig:ui:Header homeUrl="#" logo="/prestashop.svg" version="9.3.0" menuId="bo-sidebar" :search="…"> -->
<header class="ps-header d-print-none">
  <button
    type="button"
    class="ps-header__menu-toggle"
    data-bs-toggle="offcanvas"
    data-bs-target="#bo-sidebar"
    aria-controls="bo-sidebar"
    aria-label="Open the menu"
  >
    <!-- ui:Icon menu size="xl" -->
  </button>
  <a class="ps-header__brand" href="#">
    <!-- ui:Icon brand:p-monogram label="PrestaShop" size="xl" class="ps-header__monogram" -->
    <img class="ps-header__logo" src="/prestashop.svg" alt="PrestaShop" width="130" height="14" />
  </a>
  <span class="badge ps-badge ps-badge--oceanblue ps-header__version">9.3.0</span>
  <!-- <twig:block name="start">: the quick access (Component/Layout/Ui/quick_access.html.twig) -->
  <div class="ps-header__start">
    <div class="dropdown">
      <button type="button" class="ps-header-action" data-bs-toggle="dropdown" aria-expanded="false">
        <!-- ui:Icon bookmarks size="xl" class="ps-header-action__icon" -->
        <span class="ps-header-action__label">Quick access</span>
        <!-- ui:Icon keyboard_arrow_down class="ps-header-action__arrow" -->
      </button>
      <ul class="dropdown-menu ps-dropdown-menu">
        <li><a class="dropdown-item ps-dropdown-menu__item" href="#"><span class="ps-dropdown-menu__label">Orders</span></a></li>
        <li><a class="dropdown-item ps-dropdown-menu__item" href="#"><span class="ps-dropdown-menu__label">New product</span></a></li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <button type="button" class="dropdown-item ps-dropdown-menu__item">
            <!-- ui:Icon bookmark_add size="lg" class="ps-dropdown-menu__icon" -->
            <span class="ps-dropdown-menu__label">Add this page to quick access</span>
          </button>
        </li>
        <li>
          <a class="dropdown-item ps-dropdown-menu__item" href="#">
            <!-- ui:Icon settings size="lg" class="ps-dropdown-menu__icon" -->
            <span class="ps-dropdown-menu__label">Manage quick access</span>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <div id="ps-header-search" class="ps-header__search offcanvas-md offcanvas-top" tabindex="-1">
    <form class="ps-header__search-form" method="post" action="#" role="search" data-ps-ref="header-search">
      <input type="hidden" name="bo_search_type" value="0" data-ps-ref="header-search-type" />
      <div class="input-group">
        <input
          type="search"
          name="bo_query"
          value=""
          class="form-control ps-header__search-input"
          placeholder="Products, orders, customers…"
          aria-label="Search"
          data-ps-ref="header-search-input"
        />
        <button type="button" class="btn ps-header__search-scope" data-bs-toggle="dropdown" aria-expanded="false">
          <span class="visually-hidden">Search in </span>
          <span data-ps-ref="header-search-scope">Everywhere</span>
          <!-- ui:Icon keyboard_arrow_down size="lg" -->
        </button>
        <ul class="dropdown-menu ps-dropdown-menu dropdown-menu-end">
          <li>
            <button type="button" class="dropdown-item ps-dropdown-menu__item" aria-current="true" data-ps-action="set-search-type" data-ps-value="0" data-ps-data-placeholder="Products, orders, customers…">
              <!-- ui:Icon search size="lg" class="ps-dropdown-menu__icon" -->
              <span class="ps-dropdown-menu__label">Everywhere</span>
            </button>
          </li>
          <li>
            <button type="button" class="dropdown-item ps-dropdown-menu__item" data-ps-action="set-search-type" data-ps-value="1" data-ps-data-placeholder="Product name or reference">
              <!-- ui:Icon store size="lg" class="ps-dropdown-menu__icon" -->
              <span class="ps-dropdown-menu__label">Catalog</span>
            </button>
          </li>
          <li>
            <button type="button" class="dropdown-item ps-dropdown-menu__item" data-ps-action="set-search-type" data-ps-value="3" data-ps-data-placeholder="Order ID">
              <!-- ui:Icon shopping_basket size="lg" class="ps-dropdown-menu__icon" -->
              <span class="ps-dropdown-menu__label">Orders</span>
            </button>
          </li>
        </ul>
        <button type="submit" class="btn ps-header__search-submit" aria-label="Search">
          <!-- ui:Icon search size="lg" -->
        </button>
      </div>
    </form>
  </div>
  <button
    type="button"
    class="ps-header__search-toggle"
    data-bs-toggle="offcanvas"
    data-bs-target="#ps-header-search"
    aria-controls="ps-header-search"
    aria-label="Search"
  >
    <!-- ui:Icon search size="xl" -->
  </button>

  <div class="ps-header__actions">
    <!-- <twig:ui:HeaderAction icon="storefront" label="View my shop" href="#" external/> -->
    <a class="ps-header-action" href="#" target="_blank" rel="noopener noreferrer">
      <!-- ui:Icon storefront size="xl" class="ps-header-action__icon" -->
      <span class="ps-header-action__label">View my shop<span class="visually-hidden"> (opens in a new tab)</span></span>
    </a>
    <!-- <twig:ui:HeaderAction image="…" label="Marc Beier" :items="…"/> -->
    <div class="dropdown">
      <button type="button" class="ps-header-action" data-bs-toggle="dropdown" aria-expanded="false">
        <img class="ps-header-action__image" src="/playground/avatar.svg" alt="" width="24" height="24" />
        <span class="ps-header-action__label">Marc Beier</span>
        <!-- ui:Icon keyboard_arrow_down class="ps-header-action__arrow" -->
      </button>
      <ul class="dropdown-menu ps-dropdown-menu dropdown-menu-end">
        <li>
          <a class="dropdown-item ps-dropdown-menu__item" href="#">
            <!-- ui:Icon person size="lg" class="ps-dropdown-menu__icon" -->
            <span class="ps-dropdown-menu__label">Your profile</span>
          </a>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <a class="dropdown-item ps-dropdown-menu__item" href="#">
            <!-- ui:Icon logout size="lg" class="ps-dropdown-menu__icon" -->
            <span class="ps-dropdown-menu__label">Sign out</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>
