<div class="ps-page ps-page--bg-subtle ps-page--login ps-login">
  <a class="icon-link icon-link-hover ps-login__back ps-login__back--left" href="#">
    <i class="material-symbols-outlined">arrow_back</i>
    Back to PrestaShop
  </a>

  <div class="ps-login__container">
    <div class="card ps-login__card">
      <div class="card-body ps-login__card-body">
        <div class="ps-login__logo-big">
          <img class="img-fluid" src="/prestashop.svg" alt="PrestaShop" width="185" height="20" />
        </div>

        <form class="ps-login__form" novalidate>
          <h1 class="ps-login__title">Sign in to your back office</h1>

          <div class="ps-login__form-group">
            <label for="login-email" class="form-label">Email address</label>
            <input
              type="email"
              id="login-email"
              class="form-control"
              placeholder="name@example.com"
              autocomplete="email"
            />
          </div>

          <div class="ps-login__form-group">
            <label for="login-password" class="form-label">Password</label>

            <div class="ps-password-field input-group has-validation">
              <input
                type="password"
                id="login-password"
                class="form-control"
                placeholder="Password"
                autocomplete="current-password"
              />

              <!-- <twig:ui:PasswordField> -->
              <button
                class="ps-password-field__toggle btn btn-primary d-inline-flex align-items-center justify-content-center"
                type="button"
                aria-label="Show password"
                aria-controls="login-password"
                aria-pressed="false"
                data-ps-action="toggle-password"
              >
                <span class="ps-password-field__icon material-symbols-outlined fs-5 lh-1" aria-hidden="true">visibility</span>
                <span class="ps-password-field__icon ps-password-field__icon--shown material-symbols-outlined fs-5 lh-1" aria-hidden="true">visibility_off</span>
              </button>
            </div>
          </div>

          <div class="ps-login__form-group">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="login-remember" />
              <label class="form-check-label" for="login-remember">Stay signed in</label>
            </div>
          </div>

          <div class="ps-login__form-group">
            <button type="submit" class="btn btn-primary ps-login__submit">Sign in</button>
          </div>

          <div class="ps-login__form-group ps-login__form-group--end">
            <a href="#" class="link-secondary small">Forgot your password?</a>
          </div>
        </form>
      </div>
    </div>

    <div class="ps-login__copyright">
      <a class="link-secondary ps-login__copyright-link" href="#">© PrestaShop™ 2007-2026 - All rights reserved</a>
    </div>

    <div class="ps-login__social">
      <a
        href="https://x.com/PrestaShop"
        class="link-secondary ps-login__social-link"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="PrestaShop on X"
      >
        <!-- ux:icon bi/twitter-x -->
      </a>

      <a
        href="https://www.facebook.com/prestashop"
        class="link-secondary ps-login__social-link"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="PrestaShop on Facebook"
      >
        <!-- ux:icon bi/facebook -->
      </a>

      <a
        href="https://github.com/PrestaShop"
        class="link-secondary ps-login__social-link"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="PrestaShop on GitHub"
      >
        <!-- ux:icon bi/github -->
      </a>
    </div>
  </div>
</div>
